# Blueprint Render — déploiement complet (Web service Node + PostgreSQL).
# Importez ce dépôt dans Render via « New → Blueprint » en sélectionnant ce fichier.
# Renseignez ensuite les variables marquées `sync: false` dans le dashboard Render.

databases:
  - name: taskpulse-db
    databaseName: taskpulse
    user: taskpulse
    plan: free

services:
  - type: web
    name: taskpulse-saas
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build
    startCommand: npm run start
    # Production : migration sidérale (pas de db push en production).
    preDeployCommand: npx prisma migrate deploy --skip-seed
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskpulse-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
      - key: TASKPULSE_ADMIN_EMAIL
        sync: false
      - key: AUTH_SECRET
        # Généré automatiquement à chaque déploiement pour ne jamais exposer une
        # valeur en clair dans le dépôt.
        generate: random
      - key: GEMINI_API_KEY
        sync: false

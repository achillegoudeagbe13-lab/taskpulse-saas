# Blueprint Render — déploiement complet (Web service Node + PostgreSQL).
# Importez ce dépôt dans Render via « New → Blueprint » en sélectionnant ce fichier.
# Renseignez ensuite les variables marquées `sync: false` dans le dashboard Render.

databases:
  - name: mar-ci-flow-db
    databaseName: mar-ci-flow
    user: taskpulse
    plan: free

services:
  - type: web
    name: taskpulse-saas
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build
    startCommand: npm run start
    # Base neuve : on pousse le schéma puis on seed (pas de migrations existantes).
    preDeployCommand: npx prisma db push && npx prisma db seed
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mar-ci-flow-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
      - key: TASKPULSE_ADMIN_EMAIL
        sync: false
      - key: AUTH_SECRET
        # Généré automatiquement à chaque déploiement pour ne jamais exposer une
        # valeur en clair dans le dépôt.
        generate: random
      - key: GEMINI_API_KEY
        sync: false
